# TB-Net reproduction, in-distribution reference (the "best case" number).
#
# Same role as configs/baseline_densenet.yaml -- a clinic-blind random split, so
# the test set comes from the same clinics as training -- but with the compact
# attention-condenser network (models/tbnet.py, reproduction path B) instead of
# the DenseNet baseline, and with degradation switched off entirely.
#
# Read the header of models/tbnet.py before quoting this against the published
# TB-Net: that module is a reimplementation of the *idea* (a compact CNN built
# from attention condensers, param-matched to TB-Net's ~4.24M), not a port of the
# released TensorFlow checkpoint. This config measures what this repo's network
# does on clean in-distribution data; it is the ceiling every degraded and
# cross-site number is measured against, not a replication of Wong et al.'s 99.86%.
#
# Do NOT read `best_val_accuracy` from train_summary.json as the reference: it is
# the score the checkpoint was selected on, a maximum over epochs and biased
# upward. Run `tbtrust-eval` on this config and take the test accuracy from
# metrics.json, exactly as baseline_densenet.yaml instructs.
data:
  split_mode: random
  test_frac: 0.15
  val_frac: 0.15

# Clean means clean: no degradation in training, validation or the primary eval
# point. Anything above 0 here makes the number a robustness result rather than
# the best case.
degradation:
  train_low: 0.0
  train_high: 0.0
  val_fixed: 0.0

model:
  arch: tbnet
  dropout: 0.3
  # Off deliberately. The head is weakly supervised from the degradation severity
  # (manifest.uncertainty_target_from_severity), which is identically zero on this
  # config, so it would be fitting a constant and contributing only gradient noise
  # to a run whose whole purpose is a clean accuracy ceiling. Turn it back on for
  # any config where severity varies.
  with_uncertainty_head: false

train:
  epochs: 40
  lr: 1.0e-3

eval:
  # The reference number is the severity-0 point. The rest of the sweep is kept so
  # one eval run also shows how far the ceiling falls once capture quality moves.
  severity_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]
  primary_severity: 0.0
  uncertainty: [confidence, mc_dropout]
