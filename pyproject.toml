[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xctb"
version = "0.1.0"
description = "Cross-cohort, uncertainty-aware TB chest X-ray triage"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0", "pydicom>=2.4"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["xctb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
